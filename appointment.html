<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>আজকের অ্যাপয়েন্টমেন্ট</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      font-family: "SolaimanLipi", sans-serif;
      background-color: #7fb0e2;
    }
    .card {
      border-radius: 10px;
    }
    .card-body {
      padding: 1.5rem;
    }
    .appointment-item {
      padding: 12px;
      border-bottom: 1px solid #e9ecef;
    }
    .appointment-item:last-child {
      border-bottom: none;
    }
    .time-slot {
      font-weight: bold;
      color: #0d6efd;
      min-width: 90px;
    }
    .patient-name {
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">ড্যাশবোর্ড</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="appointment.html">আজকের অ্যাপয়েন্টমেন্ট</a></li>
          <li class="nav-item"><a class="nav-link" href="notification.html">নোটিফিকেশন</a></li>
        </ul>
        <button class="btn btn-danger">লগআউট</button>
      </div>
    </div>
  </nav>

  <!-- Today's Appointments -->
  <div class="container my-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-4 text-center">আজকের অ্যাপয়েন্টমেন্ট</h4>
        <div class="d-flex flex-column">
          <div class="d-flex appointment-item">
            <div class="time-slot">১০:০০ এএম</div>
            <div class="patient-name">জনাব মোঃ হাসান</div>
          </div>
          <div class="d-flex appointment-item">
            <div class="time-slot">১০:৩০ এএম</div>
            <div class="patient-name">জনাবা আয়েশা বেগম</div>
          </div>
          <div class="d-flex appointment-item">
            <div class="time-slot">১১:০০ এএম</div>
            <div class="patient-name">জনাব রিয়াজুল ইসলাম</div>
          </div>
          <div class="d-flex appointment-item">
            <div class="time-slot">১১:৩০ এএম</div>
            <div class="patient-name">জনাবা ফাতেমা রহমান</div>
          </div>
          <div class="d-flex appointment-item">
            <div class="time-slot">১২:০০ পিএম</div>
            <div class="patient-name">জনাব সোহেল রানা</div>
          </div>
        </div>
        <p class="text-center text-muted mt-3">সব অ্যাপয়েন্টমেন্ট এখানে দেখানো হচ্ছে</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
