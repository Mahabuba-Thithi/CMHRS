<!DOCTYPE html> 
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>প্রেসক্রিপশন লেখো</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: "SolaimanLipi", sans-serif;
      background-color: #7fb0e2;
    }
    .card {
      border-radius: 10px;
    }
    .card-body {
      padding: 1.5rem;
    }
    textarea {
      resize: vertical;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">ড্যাশবোর্ড</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="patienthistory.html">রোগীর ইতিহাস</a></li>
          <li class="nav-item"><a class="nav-link" href="appointment.html">আজকের অ্যাপয়েন্টমেন্ট</a></li>
          <li class="nav-item"><a class="nav-link" href="notification.html">নোটিফিকেশন</a></li>
        </ul>
        <button class="btn btn-danger">লগআউট</button>
      </div>
    </div>
  </nav>

  <!-- Prescription Form -->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4 class="card-title mb-4 text-center">প্রেসক্রিপশন লেখো</h4>
            <form action="#" method="POST">
              <div class="mb-3">
                <label for="patientId" class="form-label">রোগীর আইডি/নাম</label>
                <input type="text" id="patientId" name="patientId" class="form-control" placeholder="রোগীর আইডি অথবা নাম" required>
              </div>
              <div class="mb-3">
                <label for="prescriptionText" class="form-label">প্রেসক্রিপশন বিস্তারিত</label>
                <textarea id="prescriptionText" name="prescriptionText" class="form-control" rows="8" placeholder="ওষুধের নাম, ডোজ, সময় ইত্যাদি লিখুন..." required></textarea>
              </div>
              <div class="d-flex justify-content-between mb-3">
                <button type="reset" class="btn btn-secondary">রিসেট</button>
                <button type="submit" class="btn btn-success">প্রেসক্রিপশন সংরক্ষণ</button>
              </div>
              <div class="d-grid">
                <a href="voicenote.html" class="btn btn-info">
                    <i class="fas fa-microphone-alt me-2"></i> ভয়েস নোট যুক্ত করুন
                </a>
            </div>
            
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
