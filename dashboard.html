<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ডাক্তার ড্যাশবোর্ড</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>  
  <style>
     body {
      font-family: "SolaimanLipi", sans-serif;
      background-color: #7fb0e2;
    }
    .fingerprint-btn {
      font-size: 1.5rem;
      background: none;
      border: none;
      color: #0d6efd;
      cursor: pointer;
    }
    .fingerprint-btn:hover {
      color: #0a58ca;
    }
    @media (max-width: 576px) {
      .navbar-nav .nav-link {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body >

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">ড্যাশবোর্ড</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
         
          <li class="nav-item">
            <a class="nav-link" href="appointment.html">আজকের অ্যাপয়েন্টমেন্ট</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="notification.html" title="নোটিফিকেশন">
              <i class="fas fa-bell"></i>
            </a>
          </li>
        </ul>
        <button class="btn btn-danger">লগআউট</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 56px);">
    <div class="w-100" style="max-width: 400px;">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title text-center mb-4">রোগী অনুসন্ধান</h5>
          <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="রোগীর আইডি অথবা নাম" aria-label="Search Patient">
            <button class="btn fingerprint-btn" type="button" title="ফিঙ্গারপ্রিন্ট দিয়ে লগইন">
                <i class="fas fa-fingerprint" style="font-size: 1.5rem;"></i>
              </button>
              
          </div>
          <a href="patientProfile.html" class="btn btn-primary w-100">অনুসন্ধান</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
