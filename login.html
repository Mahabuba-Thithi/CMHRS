<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ডাক্তার লগইন</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #7fb0e2;
      font-family: "SolaimanLipi", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-card {
      max-width: 400px;
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="card login-card shadow-sm p-4 bg-white">
    <h4 class="text-center mb-4">ডাক্তার লগইন</h4>
    <form action="dashboard.html" method="POST">
      <div class="mb-3">
        <label for="email" class="form-label">ইমেইল</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="ইমেইল লিখুন" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">পাসওয়ার্ড</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="পাসওয়ার্ড লিখুন" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">লগইন করুন</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
